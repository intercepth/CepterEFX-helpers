name: Build FFmpeg (Windows x64)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish to (e.g. ffmpeg-8.1.3-1). Leave empty to build and test only."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 nasm yasm pkg-config make curl
      - name: Build
        run: bash ffmpeg/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win64
          path: _out/

  test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-win64
          path: out
      - name: Smoke test the codecs and filters the panel uses
        shell: bash
        run: bash ffmpeg/smoke-test.sh out/ffmpeg.exe

  release:
    needs: test
    if: ${{ inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-win64
          path: out
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          mkdir pkg && cp out/ffmpeg.exe pkg/ && cp ffmpeg/LICENSE-NOTICE.txt pkg/
          (cd pkg && zip -9 ../ffmpeg-win64.zip ffmpeg.exe LICENSE-NOTICE.txt)
          gh release create "$TAG" --title "$TAG" --notes-file ffmpeg/RELEASE-NOTES.md \
            ffmpeg-win64.zip out/ffmpeg-sources.tar.gz || \
          gh release upload "$TAG" ffmpeg-win64.zip out/ffmpeg-sources.tar.gz --clobber
